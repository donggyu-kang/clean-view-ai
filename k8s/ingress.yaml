apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-ai-prefix
  namespace: cleanview
spec:
  stripPrefix:
    prefixes:
      - /ai

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cleanview-ingress
  namespace: cleanview
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/ai`)
      kind: Rule
      priority: 30
      services:
        - name: cleanview-ai-engine-service
          port: 8000
      middlewares:
        - name: strip-ai-prefix
    - match: PathPrefix(`/api`)
      kind: Rule
      priority: 20
      services:
        - name: cleanview-backend-service
          port: 8080
    - match: PathPrefix(`/`)
      kind: Rule
      priority: 10
      services:
        - name: cleanview-frontend-service
          port: 80
