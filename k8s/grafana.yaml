apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: cleanview
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "REPLACE_ME"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          ports:
            - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: cleanview
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
