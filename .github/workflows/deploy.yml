name: Deploy to K3s

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 변경된 서비스 경로 감지
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend:  ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ai:       ${{ steps.filter.outputs.ai }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            ai:
              - 'ai-engine/**'

  # ── 백엔드 ─────────────────────────────────────────────────────────────────

  build-backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: yswmon/clean-view-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ── 프론트엔드 ──────────────────────────────────────────────────────────────

  build-frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: yswmon/clean-view-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # 백엔드 또는 프론트엔드 중 하나라도 빌드 성공 시 변경된 것만 재배포
  deploy:
    runs-on: self-hosted
    needs: [changes, build-backend, build-frontend]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      (needs.build-backend.result == 'success' || needs.build-frontend.result == 'success')
    steps:
      - name: 변경된 서비스만 재배포
        run: |
          if [[ "${{ needs.changes.outputs.backend }}" == "true" ]]; then
            sudo kubectl rollout restart deployment/cleanview-backend -n cleanview
            sudo kubectl rollout status deployment/cleanview-backend -n cleanview --timeout=120s
          fi
          if [[ "${{ needs.changes.outputs.frontend }}" == "true" ]]; then
            sudo kubectl rollout restart deployment/cleanview-frontend -n cleanview
            sudo kubectl rollout status deployment/cleanview-frontend -n cleanview --timeout=120s
          fi

  # ── AI 엔진 ────────────────────────────────────────────────────────────────

  build-ai:
    needs: changes
    if: ${{ needs.changes.outputs.ai == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_AI }}
          password: ${{ secrets.DOCKERHUB_TOKEN_AI }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./ai-engine
          push: true
          tags: ansgudwn/cleanviewai-ai-engine:latest
          cache-from: type=gha,scope=ai-engine
          cache-to: type=gha,mode=max,scope=ai-engine

  deploy-ai:
    runs-on: self-hosted
    needs: build-ai
    steps:
      - name: AI 엔진 재배포
        run: |
          sudo kubectl rollout restart deployment/cleanview-ai-engine -n cleanview
          sudo kubectl rollout status deployment/cleanview-ai-engine -n cleanview --timeout=120s
